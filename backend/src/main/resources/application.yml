spring:
  session:
    store-type: none

  datasource:
    username: ${DB_USERNAME:chat}
    password: ${DB_PASSWORD:}
    url: ${DB_URL:jdbc:mysql://localhost:3306/devchat}

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  profiles:
    active: dev

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${OAUTH_GITHUB_CLIENT_ID:}
            client-secret: ${OAUTH_GITHUB_SECRET:}
            scope:
              - repo
              - admin:repo_hook
              - user
        provider:
          github:
            user-name-attribute: login
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true

file:
  images:
    profile:
      path: images/profile/
      default: default-profile.png
      github: github-profile.png
    chat:
      path: images/chat/

github:
  username: GitHubBot

url:
  domain-url: http://localhost:3000
  image-url: https://d3eqoic1xpzc9x.cloudfront.net
  webhook-url: https://thedevchat.duckdns.org/api

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ap-northeast-2
    s3:
      bucket: devchat-images

jwt:
  redirection:
    base: http://localhost:3000/

  info:
    issuer: "대한민국26세 달성 배씨 배문성의 허가가 있는 토큰이올시다."
    secret: ${JWT_SECRET:local-development-only-jwt-secret-change-me}

app:
  notification-delivery:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    discord:
      webhook-url: ${NOTIFICATION_DELIVERY_DISCORD_WEBHOOK_URL:}
      alert-cooldown: 5m
