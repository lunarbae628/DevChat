name: devchat

x-devchat-app: &devchat-app
  restart: unless-stopped
  stop_grace_period: 40s
  mem_limit: 1536m
  environment:
    SPRING_PROFILES_ACTIVE: prod
    JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx1g}
    TZ: ${TZ:-Asia/Seoul}

    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_NAME: ${MYSQL_DATABASE}
    DB_USERNAME: ${MYSQL_USER}
    DB_PASSWORD: ${MYSQL_PASSWORD}

    REDIS_HOST: ${REDIS_HOST}
    REDIS_PORT: ${REDIS_PORT}

    OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID}
    OAUTH_GITHUB_SECRET: ${OAUTH_GITHUB_SECRET}
    OAUTH_GITHUB_REDIRECT_URI: ${OAUTH_GITHUB_REDIRECT_URI}

    DOMAIN_URL: ${DOMAIN_URL}
    IMAGE_URL: ${IMAGE_URL}
    WEBHOOK_URL: ${WEBHOOK_URL}
    NOTIFICATION_DELIVERY_DISCORD_WEBHOOK_URL: ${NOTIFICATION_DELIVERY_DISCORD_WEBHOOK_URL:-}

    JWT_SECRET: ${JWT_SECRET}
    ENCRYPT_SECRET: ${ENCRYPT_SECRET}

    AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
    AWS_SECRET_KEY: ${AWS_SECRET_KEY}
    AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  depends_on:
    devchat-mysql:
      condition: service_healthy
    devchat-redis:
      condition: service_healthy
  networks:
    - devchat_internal
    - devchat_proxy_net
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"
      ]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s

services:
  devchat-mysql:
    image: mysql:8.4
    container_name: devchat-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - devchat_mysql_data:/var/lib/mysql
    networks:
      - devchat_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  devchat-redis:
    image: redis:7-alpine
    container_name: devchat-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - devchat_redis_data:/data
    networks:
      - devchat_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  devchat-app-blue:
    <<: *devchat-app
    image: ghcr.io/lunarbae628/devchat-backend:dev
    container_name: devchat-app-blue
    profiles: [blue]

  devchat-app-green:
    <<: *devchat-app
    image: ghcr.io/lunarbae628/devchat-backend:dev
    container_name: devchat-app-green
    profiles: [green]

  devchat-prometheus:
    image: prom/prometheus:latest
    container_name: devchat-prometheus
    restart: unless-stopped
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - devchat_prometheus_data:/prometheus
    networks:
      - devchat_monitoring
      - devchat_proxy_net

  devchat-loki:
    image: grafana/loki:3.5.5
    container_name: devchat-loki
    restart: unless-stopped
    mem_limit: 512m
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - devchat_loki_data:/loki
    networks:
      - devchat_monitoring

  devchat-promtail:
    image: grafana/promtail:3.5
    container_name: devchat-promtail
    restart: unless-stopped
    mem_limit: 256m
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - devchat_promtail_positions:/positions
    networks:
      - devchat_monitoring

  devchat-grafana:
    image: grafana/grafana-oss:latest
    container_name: devchat-grafana
    restart: unless-stopped
    mem_limit: 256m
    depends_on:
      - devchat-prometheus
      - devchat-loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://api.devchat.o-r.kr/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - devchat_grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks:
      - devchat_monitoring
      - devchat_proxy_net

volumes:
  devchat_mysql_data:
  devchat_redis_data:
  devchat_prometheus_data:
  devchat_loki_data:
  devchat_promtail_positions:
  devchat_grafana_data:

networks:
  devchat_internal:
    internal: true

  devchat_monitoring:
    internal: true

  devchat_proxy_net:
    external: true
    name: devchat_proxy_net
